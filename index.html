
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>GV Audio Vision</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #081426;
      color: white;
    }
    header {
      padding: 22px;
      background: #102747;
      text-align: center;
    }
    header h1 {
      color: #36aaff;
      font-size: 38px;
      margin: 0;
    }
    .hero {
      padding: 35px 20px;
      text-align: center;
    }
    .hero h2 {
      font-size: 28px;
    }
    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 15px;
    }
    .category {
      background: #16345a;
      padding: 22px 10px;
      border-radius: 12px;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #a9c9e9;
    }
  </style>
</head>
<body>
  <header>
    <h1>GV.</h1>
    <p>GV AUDIO VISION</p>
  </header>

  <section class="hero">
    <h2>Make Your Event Amazing!</h2>
    <p>Professional Event Equipment On Rent</p>
  </section>

  <h2 style="padding-left:18px">
    Explore Categories
  </h2>

  <section class="categories">
    <div class="category">🔊<br>Sound Systems</div>
    <div class="category">💡<br>Lighting</div>
    <div class="category">🏗️<br>Stage & Frames</div>
    <div class="category">📽️<br>Projectors & TVs</div>
    <div class="category">🎤<br>Microphones</div>
    <div class="category">🎧<br>Accessories</div>
  </section>

  <footer>
    © GV Audio Vision
    <p>Your Event. Our Equipment.</p>
  </footer>
</body>
</html>
